name: Docs

on:
  push:
    branches: [ "main" ]
    paths: [ "docs/**", ".github/workflows/docs.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.request }}
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" dates come from git history

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read the IndexNow request
        id: indexnow
        run: echo "request=$(cat .vitepress/indexnow.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tells Bing and the other IndexNow engines (which also feed ChatGPT search and Copilot) that the pages changed.
      - name: Submit the pages to IndexNow
        continue-on-error: true
        env:
          REQUEST: ${{ needs.build.outputs.indexnow }}
        run: >
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8'
          -d "$REQUEST" -w 'IndexNow: HTTP %{http_code}\n'
