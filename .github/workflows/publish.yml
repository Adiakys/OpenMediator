name: Publish NuGet Packages

on:
  release:
    types: [published]
  # Publishes the version in Directory.Build.props from the chosen ref; already-published versions are skipped.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read
      id-token: write # trusted publishing: exchange the GitHub OIDC token for a short-lived nuget.org key

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release --no-restore /p:GeneratePackageOnBuild=false

      - name: Pack
        run: dotnet pack --configuration Release --no-restore /p:GeneratePackageOnBuild=false --output ./nupkgs

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --source "https://nuget.pkg.github.com/Adiakys/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
          dotnet nuget push "./nupkgs/*.snupkg" \
            --source "https://nuget.pkg.github.com/Adiakys/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: Log in to NuGet.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Adiakys

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
          dotnet nuget push "./nupkgs/*.snupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
