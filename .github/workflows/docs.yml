name: Docs

on:
  push:
    branches: [ "main" ]
    paths: [ "docs/**", ".github/workflows/docs.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" dates come from git history

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tells Bing and the other IndexNow engines (which also feed ChatGPT search and Copilot) that the pages changed.
  # The key is public by design: the engines check it against the file of the same name on the site.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE: https://adiakys.github.io/AnyMediator/
      KEY: 476ce3b0ed7ad3a75056b918ccf6c4fb

    steps:
      - name: Submit the sitemap URLs to IndexNow
        continue-on-error: true
        run: |
          urls=$(curl -fsSL "${SITE}sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's#</loc>##' | jq -R . | jq -s .)
          jq -n --argjson urls "$urls" --arg key "$KEY" --arg site "$SITE" \
            '{host: "adiakys.github.io", key: $key, keyLocation: ($site + $key + ".txt"), urlList: $urls}' \
            | curl -sS -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' -d @- -w 'IndexNow: HTTP %{http_code}\n'
